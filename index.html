<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapas Chimú | Catálogo de Zapatillas e Indumentaria</title>
  <link rel="icon" href="imagenes/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .titulo-urbano {
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.9), 0px 0px 15px rgba(245, 158, 11, 0.3);
    }
    html {
      scroll-behavior: smooth;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-12 font-sans selection:bg-amber-500 selection:text-black relative">

  <!-- ENCABEZADO Y MENÚ DE CATEGORÍAS -->
  <header class="bg-gray-900/95 backdrop-blur-md border-b border-amber-500/20 sticky top-0 z-40 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <img src="imagenes/logo.jpeg" alt="Zapas Chimú" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full object-cover shadow-xl shadow-amber-500/30 border-2 border-amber-500/60 hover:scale-105 transition duration-300">
        <div>
          <h1 class="text-xl sm:text-2xl font-black tracking-wider text-white italic titulo-urbano">ZAPAS CHIMU</h1>
          <p class="text-[10px] sm:text-xs text-amber-400 font-bold tracking-widest uppercase">Catálogo Exclusivo</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="abrirModalSugerencia()" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer">
          <i class="fa-solid fa-lightbulb text-amber-400"></i> <span class="hidden sm:inline">Pedir Producto</span>
        </button>
        <button id="btnAdminAuth" onclick="abrirModalAdmin()" class="bg-gray-800 hover:bg-gray-700 text-amber-300 border border-amber-500/30 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition cursor-pointer shadow-lg shadow-amber-500/10">
          <i class="fa-solid fa-lock"></i> <span class="hidden sm:inline">Modo Admin</span>
        </button>
      </div>
    </div>

    <!-- NAVEGACIÓN SUPERIOR DE CATEGORÍAS -->
    <nav class="border-t border-gray-800/80 bg-gray-950/80">
      <div id="contenedorMenuCategorias" class="max-w-6xl mx-auto px-4 flex items-center gap-2 overflow-x-auto py-2.5 no-scrollbar text-xs font-bold uppercase tracking-wider">
        <button onclick="filtrarCategoria('Todas')" class="btn-cat px-4 py-1.5 rounded-full transition whitespace-nowrap bg-amber-500 text-black shadow-md shadow-amber-500/20">Todos</button>
        <!-- Categorías dinámicas inyectadas por JS -->
      </div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">
    <!-- BANNER DE NOTIFICACIÓN -->
    <div class="bg-amber-950/20 border border-amber-500/30 rounded-2xl p-4 mb-6 flex items-center justify-between gap-3 shadow-lg flex-wrap sm:flex-nowrap">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🔥</span>
        <div>
          <p class="text-sm font-black text-amber-300 uppercase tracking-wide">Catálogo Actualizado</p>
          <p class="text-xs text-gray-400">Hacé tu pedido o consulta directo por WhatsApp.</p>
        </div>
      </div>
      <button onclick="abrirModalSugerencia()" class="text-xs font-bold text-amber-400 underline hover:text-amber-300 transition">
        ¿Buscás un modelo en particular? Pedilo acá
      </button>
    </div>

    <!-- BUSCADOR Y FILTROS -->
    <div class="space-y-4 mb-8">
      <div class="relative">
        <input type="text" id="searchInput" oninput="filtrarProductos()" placeholder="🔍 Buscar por modelo, marca o color..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white transition shadow-inner">
      </div>

      <div class="bg-gray-900/60 p-4 rounded-2xl border border-gray-800 space-y-3">
        <!-- FILTRO DE MARCAS -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="contenedorFiltroMarcas"></div>
        <!-- FILTRO DE TALLES -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 border-t border-gray-800/60 pt-3 hidden" id="contenedorFiltroTalles"></div>
      </div>
    </div>

    <!-- PANEL MODO ADMINISTRADOR -->
    <div id="panelAdmin" class="hidden bg-gray-900 border border-amber-500/40 rounded-2xl p-6 mb-8 shadow-2xl">
      <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4 flex-wrap gap-4">
        <h2 id="tituloFormAdmin" class="text-lg font-bold text-amber-300 flex items-center gap-2">
          <i class="fa-solid fa-user-gear"></i> Cargar Nuevo Producto
        </h2>
        <div class="flex gap-3 items-center flex-wrap">
          <button onclick="marcarTodosAgotados()" class="bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-500/40 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer shadow-md">
            <i class="fa-solid fa-triangle-exclamation"></i> Marcar Todo Agotado
          </button>
          <button id="btnCancelarEdicion" onclick="cancelarEdicion()" class="hidden text-xs text-amber-400 hover:underline cursor-pointer">Cancelar Edición</button>
          <button onclick="cerrarSesionAdmin()" class="text-xs text-red-400 hover:underline cursor-pointer">Cerrar Sesión</button>
        </div>
      </div>

      <!-- FORMULARIO DE CARGA -->
      <form id="formProd" onsubmit="guardarProducto(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="hidden" id="pId">
        
        <!-- CATEGORÍA -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">Categoría</label>
          <select id="pCategoriaSelect" onchange="actualizarSubcategoriasAdmin()" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white mb-2"></select>
          <input type="text" id="pCategoriaNueva" placeholder="Nueva categoría..." class="hidden w-full bg-gray-800 border border-amber-500 rounded-lg p-2 text-xs text-white">
        </div>

        <!-- SUBCATEGORÍA -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">Subcategoría / Tipo</label>
          <select id="pSubcategoriaSelect" onchange="verificarNuevaSubcategoria()" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white mb-2"></select>
          <input type="text" id="pSubcategoriaNueva" placeholder="Nueva subcategoría..." class="hidden w-full bg-gray-800 border border-amber-500 rounded-lg p-2 text-xs text-white">
        </div>

        <!-- MARCA -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">Marca</label>
          <input type="text" id="pMarca" list="listaMarcas" required placeholder="Ej: Nike, Adidas..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
          <datalist id="listaMarcas"></datalist>
        </div>

        <!-- NOMBRE / MODELO -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">Nombre del Modelo</label>
          <input type="text" id="pNombre" list="listaModelos" required placeholder="Ej: Air Force 1" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
          <datalist id="listaModelos"></datalist>
        </div>

        <!-- COLOR -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">Color / Variante</label>
          <select id="pColorSelect" onchange="verificarNuevoColor()" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white mb-2"></select>
          <input type="text" id="pColorNuevo" placeholder="Nuevo color..." class="hidden w-full bg-gray-800 border border-amber-500 rounded-lg p-2 text-xs text-white">
        </div>

        <!-- PROVEEDOR -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">Proveedor (Interno)</label>
          <select id="pProveedorSelect" onchange="verificarNuevoProveedor()" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white mb-2"></select>
          <input type="text" id="pProveedorNuevo" placeholder="Nuevo proveedor..." class="hidden w-full bg-gray-800 border border-amber-500 rounded-lg p-2 text-xs text-white">
        </div>

        <!-- PRECIO -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">Precio ($ ARS)</label>
          <input type="number" id="pPrecio" required placeholder="Ej: 69800" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
        </div>

        <!-- TALLES -->
        <div class="md:col-span-3">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-gray-400">Talles (Separados por coma)</label>
            <button type="button" onclick="generarRangoTalles()" class="text-[10px] text-amber-400 hover:underline cursor-pointer font-bold">⚡ Generar del 34 al 40</button>
          </div>
          <input type="text" id="pTalles" required placeholder="Ej: 35, 36, 37, 38, 39, 40" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
        </div>

        <!-- IMÁGENES -->
        <div class="md:col-span-3">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-gray-400">URLs de Imágenes (Una cajita por foto)</label>
            <button type="button" onclick="agregarCajaUrl()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer flex items-center gap-1">
              <i class="fa-solid fa-plus"></i> Agregar otra foto
            </button>
          </div>
          <div id="contenedorCajasUrls" class="space-y-2"></div>
        </div>

        <div class="md:col-span-3 flex items-center gap-3 bg-gray-800/60 p-3 rounded-lg border border-gray-700">
          <input type="checkbox" id="pDisponible" checked class="w-5 h-5 accent-amber-500 cursor-pointer">
          <label for="pDisponible" class="text-xs text-white font-bold cursor-pointer">Stock Disponible (Desmarcar para mostrar cartel de Agotado)</label>
        </div>

        <button type="submit" id="btnSubmitProd" class="md:col-span-3 bg-amber-500 hover:bg-amber-400 text-black font-black py-3 rounded-xl transition text-sm cursor-pointer shadow-lg shadow-amber-500/20">
          Guardar Producto en la Nube
        </button>
      </form>
    </div>

    <!-- GRID DE PRODUCTOS -->
    <div id="gridProductos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- MODAL VISOR DE IMAGEN AMPLIADA (CON FLECHAS Y MINIATURAS) -->
  <div id="modalImagen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="cerrarZoom()">
    <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <button onclick="cerrarZoom()" class="absolute -top-12 right-0 text-white text-2xl font-bold bg-gray-800 hover:bg-amber-500 hover:text-black w-10 h-10 rounded-full flex items-center justify-center transition cursor-pointer z-50">&times;</button>
      
      <div class="relative w-full flex items-center justify-center">
        <!-- Flecha Izquierda Zoom -->
        <button onclick="cambiarFotoZoom(-1)" class="absolute left-2 bg-black/70 hover:bg-amber-500 hover:text-black text-white w-10 h-10 rounded-full flex items-center justify-center transition z-30 shadow-lg">
          <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>
        
        <img id="imgZoomAmpliada" src="" alt="Zoom Producto" class="max-w-full max-h-[70vh] object-contain rounded-xl shadow-2xl border border-gray-800">
        
        <!-- Flecha Derecha Zoom -->
        <button onclick="cambiarFotoZoom(1)" class="absolute right-2 bg-black/70 hover:bg-amber-500 hover:text-black text-white w-10 h-10 rounded-full flex items-center justify-center transition z-30 shadow-lg">
          <i class="fa-solid fa-chevron-right text-sm"></i>
        </button>
      </div>

      <div id="galeriaMiniaturasZoom" class="flex gap-2 mt-4 overflow-x-auto max-w-full p-2"></div>
    </div>
  </div>

  <!-- MODAL SUGERENCIAS DE CLIENTES -->
  <div id="modalSugerencia" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="cerrarModalSugerencia()">
    <div class="bg-gray-900 border border-amber-500/40 rounded-2xl p-6 max-w-md w-full shadow-2xl relative" onclick="event.stopPropagation()">
      <button onclick="cerrarModalSugerencia()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-lg">&times;</button>
      <h3 class="text-lg font-black text-amber-300 mb-2 flex items-center gap-2">
        <i class="fa-solid fa-paper-plane"></i> ¿Buscás un producto en especial?
      </h3>
      <p class="text-xs text-gray-400 mb-4">Contanos qué modelo, talle o color estás buscando y te lo conseguimos a pedido.</p>
      
      <div class="space-y-3">
        <input type="text" id="sugModelo" placeholder="Modelo / Marca deseada (ej: Jordan 1 Retro High)" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
        <input type="text" id="sugTalle" placeholder="Tu talle (ej: 41)" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
        <textarea id="sugDetalle" rows="3" placeholder="Detalles adicionales o link de referencia..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white"></textarea>
        
        <button onclick="enviarSugerenciaWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl flex items-center justify-center gap-2 text-sm transition shadow-lg">
          <i class="fa-brands fa-whatsapp text-lg"></i> Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- BOTÓN VOLVER ARRIBA -->
  <button id="btnVolverArriba" onclick="volverArriba()" class="fixed bottom-6 right-6 z-40 bg-amber-500 hover:bg-amber-400 text-black w-12 h-12 rounded-full flex items-center justify-center shadow-2xl transition duration-300 opacity-0 pointer-events-none cursor-pointer border-2 border-black">
    <i class="fa-solid fa-arrow-up text-lg font-bold"></i>
  </button>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    const SUPABASE_URL = "https://fvxuonzcwllousjrhjcz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6eZrYUp7h1hraScKsZcPUw_puLaXnBg";
    const SUPABASE_ANON_KEY = SUPABASE_KEY;

    const NUMERO_WHATSAPP = "5491176165797";
    
    let productos = [];
    let listaCategorias = [];
    let listaSubcategorias = [];
    let listaProveedores = [];
    let listaColores = [];

    let marcaSeleccionada = "Todas";
    let talleSeleccionado = "Todos";
    let categoriaSeleccionada = "Todas";
    let esAdmin = false;
    let tallesSeleccionados = {};
    let varianteSeleccionada = {}; 
    let fotosActualesZoom = [];
    let indiceZoomActual = 0;

    window.onload = () => {
      obtenerMaestrasYProductos();
      window.addEventListener('scroll', evaluarBotonArriba);
      agregarCajaUrl('');
    };

    function volverArriba() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function evaluarBotonArriba() {
      const btn = document.getElementById('btnVolverArriba');
      if (window.scrollY > 300) {
        btn.classList.remove('opacity-0', 'pointer-events-none');
        btn.classList.add('opacity-100');
      } else {
        btn.classList.add('opacity-0', 'pointer-events-none');
        btn.classList.remove('opacity-100');
      }
    }

    async function obtenerMaestrasYProductos() {
      try {
        const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
        
        // 1. Obtener Tablas Maestras
        const [resCat, resSub, resProv, resCol, resProd] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/categorias?select=*`, { headers }),
          fetch(`${SUPABASE_URL}/rest/v1/subcategorias?select=*`, { headers }),
          fetch(`${SUPABASE_URL}/rest/v1/proveedores?select=*`, { headers }),
          fetch(`${SUPABASE_URL}/rest/v1/colores?select=*`, { headers }),
          fetch(`${SUPABASE_URL}/rest/v1/productos?select=*&order=id.desc`, { headers })
        ]);

        if (resCat.ok) listaCategorias = await resCat.json();
        if (resSub.ok) listaSubcategorias = await resSub.json();
        if (resProv.ok) listaProveedores = await resProv.json();
        if (resCol.ok) listaColores = await resCol.json();
        if (resProd.ok) productos = await resProd.json();

        actualizarMenuCategoriasPublico();
        poblarSelectsAdmin();
        actualizarDatalists();
        renderizarFiltros();
        renderizar();
      } catch (err) {
        console.error("Error al cargar datos de Supabase:", err);
      }
    }

    function obtenerIconoCategoria(nombre) {
      const n = nombre.toLowerCase();
      if (n.includes('calzado') || n.includes('zapatilla')) return 'fa-shoe-prints';
      if (n.includes('indumentaria' ) || n.includes('ropa')) return 'fa-shirt';
      if (n.includes('hogar') || n.includes('casa')) return 'fa-house';
      if (n.includes('paraguay')) return 'fa-globe-americas';
      if (n.includes('importado')) return 'fa-plane';
      return 'fa-box-open';
    }

    function actualizarMenuCategoriasPublico() {
      const contenedor = document.getElementById('contenedorMenuCategorias');
      if (!contenedor) return;

      // Botón "Todos"
      let html = `
        <button onclick="filtrarCategoria('Todas')" class="btn-cat group flex items-center gap-2 px-4 py-2 rounded-xl transition-all duration-300 whitespace-nowrap cursor-pointer ${
          categoriaSeleccionada === 'Todas' 
            ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-black shadow-lg shadow-amber-500/25 scale-105 border border-amber-300' 
            : 'bg-gray-900/90 text-gray-400 border border-gray-800 hover:border-amber-500/40 hover:text-white hover:bg-gray-800'
        }">
          <i class="fa-solid fa-border-all ${categoriaSeleccionada === 'Todas' ? 'text-black' : 'text-amber-400'} group-hover:rotate-12 transition-transform"></i>
          <span>Todos</span>
        </button>
      `;
      
      // Categorías dinámicas de la Base de Datos
      listaCategorias.forEach(cat => {
        const activa = categoriaSeleccionada.toLowerCase() === cat.nombre.toLowerCase();
        const icono = obtenerIconoCategoria(cat.nombre);
        html += `
          <button onclick="filtrarCategoria('${cat.nombre}')" class="btn-cat group flex items-center gap-2 px-4 py-2 rounded-xl transition-all duration-300 whitespace-nowrap cursor-pointer ${
            activa 
              ? 'bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-black shadow-lg shadow-amber-500/25 scale-105 border border-amber-300' 
              : 'bg-gray-900/90 text-gray-400 border border-gray-800 hover:border-amber-500/40 hover:text-white hover:bg-gray-800'
          }">
            <i class="fa-solid ${icono} ${activa ? 'text-black' : 'text-amber-400'} group-hover:scale-110 transition-transform"></i>
            <span>${cat.nombre}</span>
          </button>
        `;
      });

      contenedor.innerHTML = html;
    }

    function poblarSelectsAdmin() {
      // Categorías
      const selCat = document.getElementById('pCategoriaSelect');
      if (selCat) {
        selCat.innerHTML = listaCategorias.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('') +
                           `<option value="__nuevo__">[ + Agregar nueva categoría... ]</option>`;
        actualizarSubcategoriasAdmin();
      }

      // Proveedores
      const selProv = document.getElementById('pProveedorSelect');
      if (selProv) {
        selProv.innerHTML = listaProveedores.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('') +
                            `<option value="__nuevo__">[ + Agregar nuevo proveedor... ]</option>`;
      }

      // Colores
      const selCol = document.getElementById('pColorSelect');
      if (selCol) {
        selCol.innerHTML = listaColores.map(co => `<option value="${co.id}">${co.nombre}</option>`).join('') +
                           `<option value="__nuevo__">[ + Agregar nuevo color... ]</option>`;
      }
    }

    function actualizarSubcategoriasAdmin() {
      const selCat = document.getElementById('pCategoriaSelect');
      const selSub = document.getElementById('pSubcategoriaSelect');
      if (!selCat || !selSub) return;

      const catId = selCat.value;
      if (catId === '__nuevo__') {
        document.getElementById('pCategoriaNueva').classList.remove('hidden');
        selSub.innerHTML = `<option value="__nuevo__">[ + Agregar nueva subcategoría... ]</option>`;
        document.getElementById('pSubcategoriaNueva').classList.remove('hidden');
        return;
      } else {
        document.getElementById('pCategoriaNueva').classList.add('hidden');
        document.getElementById('pCategoriaNueva').value = '';
      }

      const subsFiltradas = listaSubcategorias.filter(s => s.categoria_id == catId);
      selSub.innerHTML = subsFiltradas.map(s => `<option value="${s.id}">${s.nombre}</option>`).join('') +
                         `<option value="__nuevo__">[ + Agregar nueva subcategoría... ]</option>`;
      verificarNuevaSubcategoria();
    }

    function verificarNuevaSubcategoria() {
      const selSub = document.getElementById('pSubcategoriaSelect');
      const inputSubNueva = document.getElementById('pSubcategoriaNueva');
      if (selSub.value === '__nuevo__') {
        inputSubNueva.classList.remove('hidden');
      } else {
        inputSubNueva.classList.add('hidden');
        inputSubNueva.value = '';
      }
    }

    function verificarNuevoProveedor() {
      const sel = document.getElementById('pProveedorSelect');
      const input = document.getElementById('pProveedorNuevo');
      if (sel.value === '__nuevo__') input.classList.remove('hidden');
      else { input.classList.add('hidden'); input.value = ''; }
    }

    function verificarNuevoColor() {
      const sel = document.getElementById('pColorSelect');
      const input = document.getElementById('pColorNuevo');
      if (sel.value === '__nuevo__') input.classList.remove('hidden');
      else { input.classList.add('hidden'); input.value = ''; }
    }

    function actualizarDatalists() {
      const marcas = [...new Set(productos.map(p => p.marca ? p.marca.trim() : '').filter(m => m))];
      const modelos = [...new Set(productos.map(p => p.nombre ? p.nombre.trim() : '').filter(m => m))];

    function renderizarFiltros() {
      // Filtramos los productos según la categoría activa
      const productosDisponiblesFiltro = productos.filter(p => {
        let catNombre = 'Calzado';
        const encontradaCat = listaCategorias.find(c => c.id === p.categoria_id);
        if (encontradaCat) catNombre = encontradaCat.nombre;

        return categoriaSeleccionada.toLowerCase() === "todas" || catNombre.toLowerCase() === categoriaSeleccionada.toLowerCase();
      });

      // Renderizar marcas dinámicas de esta categoría
      const contenedorMarcas = document.getElementById('contenedorFiltroMarcas');
      if (contenedorMarcas) {
        const marcas = productosDisponiblesFiltro.map(p => p.marca ? p.marca.trim() : '').filter(m => m !== '');
        const marcasUnicas = ["Todas", ...new Set(marcas)];

        contenedorMarcas.innerHTML = `
          <div class="w-full flex items-center flex-wrap gap-2">
            <span class="text-xs font-bold text-gray-400 mr-2 uppercase tracking-wider">Marca:</span>
            ${marcasUnicas.map(marca => `
              <button onclick="filtrarMarca('${marca}')" class="btn-marca ${marcaSeleccionada.toLowerCase() === marca.toLowerCase() ? 'bg-amber-500 text-black font-black shadow-md shadow-amber-500/27 scale-105' : 'bg-gray-800 text-gray-300 border border-gray-700 hover:border-amber-500/50 hover:text-white'} px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer">
                ${marca}
              </button>
            `).join('')}
          </div>
        `;
      }

      // Renderizar talles (Se oculta estrictamente si estamos en "Todos")
      const contenedorTalles = document.getElementById('contenedorFiltroTalles');
      if (contenedorTalles) {
        if (categoriaSeleccionada.toLowerCase() === "todas") {
          contenedorTalles.classList.add('hidden');
          contenedorTalles.innerHTML = '';
        } else {
          contenedorTalles.classList.remove('hidden');

          let todosTalles = [];
          productosDisponiblesFiltro.forEach(p => {
            let t = Array.isArray(p.talles) ? p.talles : String(p.talles || '').split(',').map(x => x.trim());
            todosTalles.push(...t);
          });
          
          const tallesCrudos = [...new Set(todosTalles.filter(t => t !== ''))];

          // Separar entre numéricos y de texto (letras)
          const tallesNumericos = tallesCrudos.filter(t => !isNaN(t)).sort((a, b) => Number(a) - Number(b));
          
          // Orden lógico para talles de indumentaria
          const ordenLetras = ['xs', 's', 'm', 'l', 'xl', 'xxl', 'xxxl', 'unique', 'único'];
          const tallesTexto = tallesCrudos.filter(t => isNaN(t)).sort((a, b) => {
            const indexA = ordenLetras.indexOf(a.toLowerCase());
            const indexB = ordenLetras.indexOf(b.toLowerCase());
            if (indexA !== -1 && indexB !== -1) return indexA - indexB;
            if (indexA !== -1) return -1;
            if (indexB !== -1) return 1;
            return a.localeCompare(b);
          });

          const tallesUnicos = ["Todos", ...tallesNumericos, ...tallesTexto];

          contenedorTalles.innerHTML = `
            <div class="w-full flex items-center flex-wrap gap-2">
              <span class="text-xs font-bold text-gray-400 mr-2 uppercase tracking-wider">Talle:</span>
              ${tallesUnicos.map(talle => `
                <button onclick="filtrarTalle('${talle}')" class="btn-talle ${talleSeleccionado.toString().toLowerCase() === talle.toString().toLowerCase() ? 'bg-amber-500 text-black font-black shadow-md shadow-amber-500/27 scale-105' : 'bg-gray-800 text-gray-300 border border-gray-700 hover:border-amber-500/50 hover:text-white'} px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer">
                  ${talle}
                </button>
              `).join('')}
            </div>
          `;
        }
      }
    }

    function generarRangoTalles() {
      const desde = prompt("Talle inicial (ej: 34):", "34");
      const hasta = prompt("Talle final (ej: 40):", "40");
      if (!desde || !hasta) return;
      
      let inicio = parseInt(desde);

    function obtenerArrayFotos(fotoField) {
      if (!fotoField) return [];
      let str = String(fotoField).replace(/[\[\]"]/g, '');
      return str.split(/[\n,]+/).map(f => f.trim()).filter(f => f !== '');
    }

    // ZOOM CON NAVEGACIÓN Y MINIATURAS
    function abrirZoom(fotoField, indiceInicial = 0) {
      fotosActualesZoom = obtenerArrayFotos(fotoField);
      if (fotosActualesZoom.length === 0) return;
      indiceZoomActual = indiceInicial;
      mostrarFotoZoom();
      document.getElementById('modalImagen').classList.remove('hidden');
    }

    function mostrarFotoZoom() {
      const imgElem = document.getElementById('imgZoomAmpliada');
      imgElem.src = fotosActualesZoom[indiceZoomActual];

      const contenedorMini = document.getElementById('galeriaMiniaturasZoom');
      if (fotosActualesZoom.length > 1) {
        contenedorMini.innerHTML = fotosActualesZoom.map((url, idx) => `
          <img src="${url}" onclick="indiceZoomActual=${idx}; mostrarFotoZoom();" class="w-16 h-16 object-cover rounded-xl border-2 ${idx === indiceZoomActual ? 'border-amber-500 scale-105' : 'border-gray-800 opacity-60'} cursor-pointer hover:opacity-100 transition">
        `).join('');
      } else {
        contenedorMini.innerHTML = '';
      }
    }

    function cambiarFotoZoom(direccion) {
      if (fotosActualesZoom.length <= 1) return;
      indiceZoomActual += direccion;
      if (indiceZoomActual < 0) indiceZoomActual = fotosActualesZoom.length - 1;
      if (indiceZoomActual >= fotosActualesZoom.length) indiceZoomActual = 0;
      mostrarFotoZoom();
    }

    function cerrarZoom() {
      document.getElementById('modalImagen').classList.add('hidden');
    }

    function renderizar() {

      const busquedaInput = document.getElementById('searchInput');

        const marca = p.marca || '';

        if (encontradaCat) catNombre = encontradaCat.nombre;

        const coincideCat = categoriaSeleccionada === "Todas" || catNombre.toLowerCase() === categoriaSeleccionada.toLowerCase();
        const coincideMarca = marcaSeleccionada === "Todas" || marca.toLowerCase() === marcaSeleccionada.toLowerCase();
        
        let listaTalles = Array.isArray(p.talles) ? p.talles : String(p.talles || '').split(',').map(t => t.trim());
        const coincideTalle = talleSeleccionado === "Todos" || listaTalles.some(t => t.toLowerCase() === talleSeleccionado.toLowerCase());
        const coincideBusqueda = nombre.toLowerCase().includes(busqueda) || marca.toLowerCase().includes(busqueda);
        
        return coincideCat && coincideMarca && coincideTalle && coincideBusqueda;
      });

      if (filtrados.length === 0) {

        const estaDisponible = p.disponible !== false;

          <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-amber-500/50 hover:shadow-xl hover:shadow-amber-500/5 transition duration-300 group">
            <div>
              <div class="relative h-64 bg-gray-950 overflow-hidden flex items-center justify-center p-2 cursor-pointer" onclick="abrirZoom(${fotosEscapadas}, 0)">
                <img src="${fotoPrincipal}" alt="${p.nombre}" class="w-full h-full object-contain group-hover:scale-105 transition duration-300 ${!estaDisponible ? 'opacity-75' : ''}" onerror="this.src='https://via.placeholder.com/400x400?text=Foto+No+Disponible'">
                
                <span class="absolute top-3 left-3 bg-black/70 backdrop-blur-md border border-amber-500/30 text-xs px-3 py-1 rounded-full text-amber-300 font-black uppercase tracking-wider">${p.marca || 'Zapatillas'}</span>
                
                ${!estaDisponible ? `
                  <span class="absolute top-3 right-3 bg-red-600/90 text-white font-black text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow-lg border border-red-400/50 flex items-center gap-1 z-10">
                    <i class="fa-solid fa-circle-xmark"></i> Agotado

                ${listaFotos.length > 1 ? `

    async function guardarProducto(e) {
      e.preventDefault();
      const idEditando = document.getElementById('pId').value;
      const tallesInput = document.getElementById('pTalles').value;
      const arrayTalles = tallesInput.split(',').map(t => t.trim()).filter(t => t !== "");

      const listaLimpia = obtenerArrayFotosInput();
      if (listaLimpia.length === 0) {
        alert("❌ Debes agregar al menos una URL de imagen.");
        return;
      }
      const fotoTextoPlano = listaLimpia.join(', ');
      const estaDisponible = document.getElementById('pDisponible').checked;

      let categoria_id = document.getElementById('pCategoriaSelect').value;
      let subcategoria_id = document.getElementById('pSubcategoriaSelect').value;
      let proveedor_id = document.getElementById('pProveedorSelect').value;
      let color_id = document.getElementById('pColorSelect').value;

      // Normalizar la Marca ingresada para evitar duplicados por mayúsculas/minúsculas (ej: "nike" -> "Nike")
      let marcaInput = document.getElementById('pMarca').value.trim();
      const marcaExistente = productos.find(p => p.marca && p.marca.toLowerCase() === marcaInput.toLowerCase());
      if (marcaExistente) {
        marcaInput = marcaExistente.marca; // Reutiliza la capitalización que ya existía
      }

      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      };

      try {
        // 1. CATEGORÍA: Verificar si ya existe (ignorando mayúsculas/minúsculas)
        if (categoria_id === '__nuevo__') {
          const nuevaCatNombre = document.getElementById('pCategoriaNueva').value.trim();
          if (!nuevaCatNombre) { alert("Escriba el nombre de la nueva categoría"); return; }
          
          const catEncontrada = listaCategorias.find(c => c.nombre.toLowerCase() === nuevaCatNombre.toLowerCase());
          if (catEncontrada) {
            categoria_id = catEncontrada.id; // Ya existía, usamos su ID
          } else {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/categorias`, {
              method: 'POST', headers, body: JSON.stringify({ nombre: nuevaCatNombre })
            });
            const data = await res.json();
            categoria_id = data[0].id;
          }
        }

        // 2. SUBCATEGORÍA: Verificar si ya existe dentro de esa categoría (ignorando mayúsculas/minúsculas)
        if (subcategoria_id === '__nuevo__') {
          const nuevaSubNombre = document.getElementById('pSubcategoriaNueva').value.trim();
          if (!nuevaSubNombre) { alert("Escriba el nombre de la nueva subcategoría"); return; }
          
          const subEncontrada = listaSubcategorias.find(s => s.categoria_id == categoria_id && s.nombre.toLowerCase() === nuevaSubNombre.toLowerCase());
          if (subEncontrada) {
            subcategoria_id = subEncontrada.id;
          } else {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/subcategorias`, {
              method: 'POST', headers, body: JSON.stringify({ categoria_id: parseInt(categoria_id), nombre: nuevaSubNombre })
            });
            const data = await res.json();
            subcategoria_id = data[0].id;
          }
        }

        // 3. PROVEEDOR: Verificar si ya existe (ignorando mayúsculas/minúsculas)
        if (proveedor_id === '__nuevo__') {
          const nuevoProvNombre = document.getElementById('pProveedorNuevo').value.trim();
          if (!nuevoProvNombre) { alert("Escriba el nombre del nuevo proveedor"); return; }
          
          const provEncontrado = listaProveedores.find(p => p.nombre.toLowerCase() === nuevoProvNombre.toLowerCase());
          if (provEncontrado) {
            proveedor_id = provEncontrado.id;
          } else {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/proveedores`, {
              method: 'POST', headers, body: JSON.stringify({ nombre: nuevoProvNombre })
            });
            const data = await res.json();
            proveedor_id = data[0].id;
          }
        }

        // 4. COLOR: Verificar si ya existe (ignorando mayúsculas/minúsculas)
        if (color_id === '__nuevo__') {
          const nuevoColNombre = document.getElementById('pColorNuevo').value.trim();
          if (!nuevoColNombre) { alert("Escriba el nombre del nuevo color"); return; }
          
          const colEncontrado = listaColores.find(co => co.nombre.toLowerCase() === nuevoColNombre.toLowerCase());
          if (colEncontrado) {
            color_id = colEncontrado.id;
          } else {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/colores`, {
              method: 'POST', headers, body: JSON.stringify({ nombre: nuevoColNombre })
            });
            const data = await res.json();
            color_id = data[0].id;
          }
        }

        const datosProducto = {
          categoria_id: parseInt(categoria_id),
          subcategoria_id: parseInt(subcategoria_id),
          proveedor_id: parseInt(proveedor_id),
          color_id: parseInt(color_id),
          marca: marcaInput,
          nombre: document.getElementById('pNombre').value.trim(),
          precio: Number(document.getElementById('pPrecio').value),
          talles: arrayTalles,
          foto: fotoTextoPlano,
          disponible: estaDisponible
        };

        let res;
        if (idEditando) {
          res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${idEditando}`, {
            method: 'PATCH',
            headers: { 
              'apikey': SUPABASE_KEY, 
              'Authorization': `Bearer ${SUPABASE_KEY}`, 
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify(datosProducto)
          });
        } else {
          res = await fetch(`${SUPABASE_URL}/rest/v1/productos`, {
            method: 'POST',
            headers: { 
              'apikey': SUPABASE_KEY, 
              'Authorization': `Bearer ${SUPABASE_KEY}`, 
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify(datosProducto)
          });
        }

        if (res.ok) {
          alert(idEditando ? "✅ Producto actualizado en la nube." : "✅ Producto subido correctamente.");
          cancelarEdicion();
          obtenerMaestrasYProductos();
        } else {
          alert("❌ Error al guardar en Supabase: " + await res.text());
        }
      } catch (err) { 
        console.error(err); 
        alert("❌ Error de red al conectar con Supabase.");
      }
    }

    function obtenerArrayFotosInput() {
      const inputs = document.querySelectorAll('.input-url-foto');
      let urls = [];
      inputs.forEach(input => {
        if (input.value.trim() !== '') urls.push(input.value.trim());
      });
      return urls;
    }

    async function borrarProducto(id) {
      if (!confirm("¿Estás seguro de eliminar este producto?")) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${id}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          obtenerMaestrasYProductos();
        } else {
          alert("Error al eliminar.");
        }
      } catch (err) {
        alert("Error de red.");
      }
    }

    function cargarDatosEdicion(id) {
      const p = productos.find(x => x.id === id);
      if (!p) return;

      document.getElementById('pId').value = p.id;
      if (p.categoria_id) document.getElementById('pCategoriaSelect').value = p.categoria_id;
      actualizarSubcategoriasAdmin();
      if (p.subcategoria_id) document.getElementById('pSubcategoriaSelect').value = p.subcategoria_id;
      if (p.proveedor_id) document.getElementById('pProveedorSelect').value = p.proveedor_id;
      if (p.color_id) document.getElementById('pColorSelect').value = p.color_id;

      document.getElementById('pMarca').value = p.marca || '';
      document.getElementById('pNombre').value = p.nombre || '';
      document.getElementById('pPrecio').value = p.precio || '';
      
      let tallesStr = Array.isArray(p.talles) ? p.talles.join(', ') : p.talles;
      document.getElementById('pTalles').value = tallesStr || '';
      document.getElementById('pDisponible').checked = p.disponible !== false;

      const contenedor = document.getElementById('contenedorCajasUrls');
      contenedor.innerHTML = '';
      const listaF = obtenerArrayFotos(p.foto);
      if (listaF.length > 0) {
        listaF.forEach(url => agregarCajaUrl(url));
      } else {
        agregarCajaUrl('');
      }

      document.getElementById('tituloFormAdmin').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Editando Producto #${id}`;
      document.getElementById('btnCancelarEdicion').classList.remove('hidden');
      document.getElementById('panelAdmin').classList.remove('hidden');
      window.scrollTo({ top: document.getElementById('panelAdmin').offsetTop - 50, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      document.getElementById('formProd').reset();
      document.getElementById('pId').value = '';
      document.getElementById('tituloFormAdmin').innerHTML = `<i class="fa-solid fa-user-gear"></i> Cargar Nuevo Producto`;
      document.getElementById('btnCancelarEdicion').classList.add('hidden');
      document.getElementById('contenedorCajasUrls').innerHTML = '';
      agregarCajaUrl('');
    }

    async function marcarTodosAgotados() {
      if (!confirm("¿Deseas marcar TODOS los productos como agotados?")) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=gt.0`, {
          method: 'PATCH',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ disponible: false })
        });
        if (res.ok) { obtenerMaestrasYProductos(); }
      } catch (err) { alert("Error al actualizar."); }
    }

    function abrirModalSugerencia() {
      document.getElementById('modalSugerencia').classList.remove('hidden');
    }
    function cerrarModalSugerencia() {
      document.getElementById('modalSugerencia').classList.add('hidden');
    }
    function enviarSugerenciaWhatsApp() {
      const modelo = document.getElementById('sugModelo').value.trim();
      const talle = document.getElementById('sugTalle').value.trim();
      const detalle = document.getElementById('sugDetalle').value.trim();

      if (!modelo) { alert("Por favor indicá el modelo o marca."); return; }

      const msg = `Hola Zapas Chimú! 👟 Busco un producto a pedido:\n\n• Modelo: ${modelo}\n• Talle: ${talle || 'No especificado'}\n• Detalles: ${detalle || 'Sin detalles'}`;
      window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=` + encodeURIComponent(msg), '_blank');
      cerrarModalSugerencia();
    }
  </script>
</body>
</html>
