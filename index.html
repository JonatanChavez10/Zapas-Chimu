<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapas Chimú | Catálogo Importado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-12 font-sans">

  <!-- ENCABEZADO -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center font-bold text-white text-xl shadow-lg shadow-purple-500/30">
          👟
        </div>
        <div>
          <h1 class="text-xl font-black tracking-wider text-white">ZAPAS CHIMÚ</h1>
          <p class="text-xs text-purple-400 font-medium">CATÁLOGO IMPORTADO</p>
        </div>
      </div>

      <button id="btnAdminAuth" onclick="abrirModalAdmin()" class="bg-gray-800 hover:bg-gray-700 text-purple-300 border border-purple-500/30 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition cursor-pointer">
        <i class="fa-solid fa-lock"></i> Modo Dueño
      </button>
    </div>
  </header>

  <!-- BANNER NOTIFICACIÓN -->
  <main class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-purple-900/30 border border-purple-500/30 rounded-2xl p-4 mb-6 flex items-center gap-3">
      <span class="text-2xl">🔔</span>
      <div>
        <p class="text-sm font-semibold text-purple-200">Catálogo Actualizado</p>
        <p class="text-xs text-gray-400">Hacé tu pedido directo a nuestro WhatsApp con stock al instante.</p>
      </div>
    </div>

    <!-- BUSCADOR Y FILTROS -->
    <div class="space-y-4 mb-8">
      <input type="text" id="searchInput" oninput="filtrarProductos()" placeholder="Buscar por modelo o marca..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 transition">

      <div class="flex flex-wrap gap-2 items-center" id="contenedorFiltroMarcas">
        <!-- Se generan solas las marcas -->
      </div>
    </div>

    <!-- MODO DUEÑO / PANEL -->
    <div id="panelAdmin" class="hidden bg-gray-900 border border-purple-500/40 rounded-2xl p-6 mb-8 shadow-2xl">
      <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
        <h2 id="tituloFormAdmin" class="text-lg font-bold text-purple-300 flex items-center gap-2">
          <i class="fa-solid fa-user-gear"></i> Cargar Nuevo Producto
        </h2>
        <div class="flex gap-3 items-center">
          <button id="btnCancelarEdicion" onclick="cancelarEdicion()" class="hidden text-xs text-yellow-400 hover:underline cursor-pointer">Cancelar Edición</button>
          <button onclick="cerrarSesionAdmin()" class="text-xs text-red-400 hover:underline cursor-pointer">Cerrar Sesión</button>
        </div>
      </div>

      <!-- TABS PANEL -->
      <div class="flex gap-4 mb-6 border-b border-gray-800">
        <button id="tabProd" onclick="cambiarTab('prod')" class="pb-2 border-b-2 border-purple-500 font-bold text-sm text-purple-300 cursor-pointer">Gestión de Productos</button>
        <button id="tabCloud" onclick="cambiarTab('cloud')" class="pb-2 border-b-2 border-transparent text-sm text-gray-400 cursor-pointer">☁️ Configuración Cloud</button>
      </div>

      <!-- FORMULARIO PRODUCTO -->
      <form id="formProd" onsubmit="guardarProducto(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="pId">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Nombre del Modelo</label>
          <input type="text" id="pNombre" required placeholder="Ej: Air Force 1" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Marca (Escribila libremente)</label>
          <input type="text" id="pMarca" required placeholder="Ej: Nike, Adidas..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Precio ($ ARS)</label>
          <input type="number" id="pPrecio" required placeholder="Ej: 69800" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Talles (separados por coma)</label>
          <input type="text" id="pTalles" required placeholder="Ej: 38, 39, 40, 41" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-gray-400 mb-1">URLs de Imágenes (separadas por coma)</label>
          <input type="text" id="pFoto" required placeholder="Ej: https://i.postimg.cc/... , https://i.postimg.cc/..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm">
          <p class="text-[10px] text-gray-500 mt-1">Podés pegar varios enlaces separados por comas para subir más de una foto.</p>
        </div>
        <button type="submit" id="btnSubmitProd" class="md:col-span-2 bg-purple-600 hover:bg-purple-500 font-bold py-3 rounded-xl transition text-sm cursor-pointer">
          Guardar Producto en la Nube
        </button>
      </form>

      <!-- CONFIGURACIÓN SUPABASE -->
      <form id="formCloud" onsubmit="guardarConfigCloud(event)" class="hidden space-y-4">
        <p class="text-xs text-gray-400">Pegá aquí las credenciales de tu proyecto de Supabase:</p>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Project URL de Supabase</label>
          <input type="text" id="supabaseUrl" placeholder="https://xxxxxx.supabase.co" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">API Key (Publishable / anon key)</label>
          <input type="text" id="supabaseKey" placeholder="sb_publishable_..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm">
        </div>
        <button type="submit" class="bg-green-600 hover:bg-green-500 font-bold px-6 py-2.5 rounded-xl text-sm transition cursor-pointer">
          Guardar Configuración Cloud
        </button>
      </form>
    </div>

    <!-- LISTA DE PRODUCTOS -->
    <div id="gridProductos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Se cargan dinámicamente -->
    </div>
  </main>

  <!-- MODAL VISOR DE IMAGEN AMPLIADA -->
  <div id="modalImagen" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="cerrarZoom()">
    <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
      <button onclick="cerrarZoom()" class="absolute -top-10 right-0 text-white text-2xl font-bold bg-gray-800 hover:bg-red-600 w-8 h-8 rounded-full flex items-center justify-center transition cursor-pointer">&times;</button>
      <img id="imgZoomAmpliada" src="" alt="Zoom Zapatilla" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-2xl border border-gray-800">
      
      <!-- Miniaturas para cambiar si hay varias fotos -->
      <div id="galeriaMiniaturasZoom" class="flex gap-2 mt-4 overflow-x-auto max-w-full p-2">
        <!-- Generadas dinámicamente -->
      </div>
    </div>
  </div>

  <!-- SCRIPT LÓGICA -->
  <script>
    const CLAVE_DUENO = "SayJo022925*";
    const NUMERO_WHATSAPP = "5491176165797";
    let productos = [];
    let marcaSeleccionada = "Todas";
    let esAdmin = false;
    let tallesSeleccionados = {};
    let fotosActualesZoom = [];

    window.onload = () => {
      cargarConfiguracionCloud();
      obtenerProductos();
    };

    function cargarConfiguracionCloud() {
      const url = localStorage.getItem('sp_url');
      const key = localStorage.getItem('sp_key');
      if (url && document.getElementById('supabaseUrl')) document.getElementById('supabaseUrl').value = url;
      if (key && document.getElementById('supabaseKey')) document.getElementById('supabaseKey').value = key;
    }

    function guardarConfigCloud(e) {
      e.preventDefault();
      const url = document.getElementById('supabaseUrl').value.trim().replace(/\/$/, '');
      const key = document.getElementById('supabaseKey').value.trim();
      localStorage.setItem('sp_url', url);
      localStorage.setItem('sp_key', key);
      alert("✅ Configuración guardada correctamente.");
      obtenerProductos();
    }

    async function obtenerProductos() {
      const url = localStorage.getItem('sp_url');
      const key = localStorage.getItem('sp_key');

      if (url && key) {
        try {
          const res = await fetch(`${url}/rest/v1/productos?select=*&order=id.desc`, {
            headers: { 'apikey': key, 'Authorization': `Bearer ${key}` }
          });
          if (res.ok) {
            productos = await res.json();
            renderizarFiltrosMarcas();
            renderizar();
            return;
          }
        } catch (err) { console.error("Error cargando de Supabase:", err); }
      }

      const local = localStorage.getItem('zapas_local');
      productos = local ? JSON.parse(local) : [];
      renderizarFiltrosMarcas();
      renderizar();
    }

    function renderizarFiltrosMarcas() {
      const contenedor = document.getElementById('contenedorFiltroMarcas');
      if (!contenedor) return;

      const marcas = productos.map(p => p.marca ? p.marca.trim() : '').filter(m => m !== '');
      const marcasUnicas = ["Todas", ...new Set(marcas)];

      contenedor.innerHTML = `<span class="text-xs font-bold text-gray-400 mr-2 uppercase">Marca:</span>` +
        marcasUnicas.map(marca => `
          <button onclick="filtrarMarca('${marca}')" class="btn-marca ${marcaSeleccionada.toLowerCase() === marca.toLowerCase() ? 'bg-purple-600 text-white' : 'bg-gray-900 text-gray-400 border border-gray-800'} px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer">
            ${marca}
          </button>
        `).join('');
    }

    function seleccionarTalle(idProd, talle) {
      tallesSeleccionados[idProd] = talle;
      renderizar();
    }

    // ABRIR ZOOM DE IMAGEN CON SOPORTE MULTIFOTO
    function abrirZoom(listaFotosStr, indiceInicial = 0) {
      if (!listaFotosStr) return;
      if (typeof listaFotosStr === 'string') {
        fotosActualesZoom = listaFotosStr.split(',').map(f => f.trim()).filter(f => f !== '');
      } else if (Array.isArray(listaFotosStr)) {
        fotosActualesZoom = listaFotosStr;
      }

      if (fotosActualesZoom.length === 0) return;

      mostrarFotoZoom(indiceInicial);
      document.getElementById('modalImagen').classList.remove('hidden');
    }

    function mostrarFotoZoom(indice) {
      const imgElem = document.getElementById('imgZoomAmpliada');
      imgElem.src = fotosActualesZoom[indice];

      const contenedorMini = document.getElementById('galeriaMiniaturasZoom');
      if (fotosActualesZoom.length > 1) {
        contenedorMini.innerHTML = fotosActualesZoom.map((url, idx) => `
          <img src="${url}" onclick="mostrarFotoZoom(${idx})" class="w-16 h-16 object-cover rounded-lg border-2 ${idx === indice ? 'border-purple-500 scale-105' : 'border-transparent opacity-60'} cursor-pointer hover:opacity-100 transition">
        `).join('');
      } else {
        contenedorMini.innerHTML = '';
      }
    }

    function cerrarZoom() {
      document.getElementById('modalImagen').classList.add('hidden');
    }

    function renderizar() {
      const grid = document.getElementById('gridProductos');
      if (!grid) return;

      const busquedaInput = document.getElementById('searchInput');
      const busqueda = busquedaInput ? busquedaInput.value.toLowerCase() : '';

      const filtrados = productos.filter(p => {
        const marca = p.marca || '';
        const nombre = p.nombre || '';
        const coincideMarca = marcaSeleccionada === "Todas" || marca.toLowerCase() === marcaSeleccionada.toLowerCase();
        const coincideBusqueda = nombre.toLowerCase().includes(busqueda) || marca.toLowerCase().includes(busqueda);
        return coincideMarca && coincideBusqueda;
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No hay productos cargados todavía. Entrá al Modo Dueño para agregar el primero.</div>`;
        return;
      }

      grid.innerHTML = filtrados.map(p => {
        let listaTalles = [];
        if (Array.isArray(p.talles)) {
          listaTalles = p.talles;
        } else if (typeof p.talles === 'string') {
          listaTalles = p.talles.split(',').map(t => t.trim());
        }

        // Manejo de múltiples fotos (guarda string o array)
        let listaFotos = [];
        if (Array.isArray(p.foto)) {
          listaFotos = p.foto;
        } else if (typeof p.foto === 'string') {
          listaFotos = p.foto.split(',').map(f => f.trim()).filter(f => f !== '');
        }
        const fotoPrincipal = listaFotos[0] || 'https://via.placeholder.com/400x400?text=Foto+No+Disponible';
        const fotosJsonEscapadas = JSON.stringify(listaFotos).replace(/"/g, '&quot;');

        if (!tallesSeleccionados[p.id] && listaTalles.length > 0) {
          tallesSeleccionados[p.id] = listaTalles[0];
        }
        const talleElegido = tallesSeleccionados[p.id] || (listaTalles[0] || 'A consultar');
        const linkWp = `https://wa.me/${NUMERO_WHATSAPP}?text=` + encodeURIComponent(`Hola Zapas Chimú! Me interesa el modelo ${p.marca || ''} ${p.nombre || ''} - Talle: ${talleElegido} ($${Number(p.precio || 0).toLocaleString('es-AR')})`);

        return `
          <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-purple-500/50 transition duration-300">
            <div>
              <div class="relative h-64 bg-gray-950 overflow-hidden flex items-center justify-center p-2 cursor-pointer group" onclick="abrirZoom(${fotosJsonEscapadas}, 0)">
                <img src="${fotoPrincipal}" alt="${p.nombre}" class="w-full h-full object-contain group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/400x400?text=Foto+No+Disponible'">
                <span class="absolute top-3 left-3 bg-black/60 backdrop-blur-md border border-white/10 text-xs px-2.5 py-1 rounded-full text-purple-300 font-semibold">${p.marca || 'Zapatillas'}</span>
                
                ${listaFotos.length > 1 ? `<span class="absolute bottom-3 right-3 bg-black/70 backdrop-blur-md text-[10px] px-2 py-0.5 rounded-md text-white font-bold flex items-center gap-1"><i class="fa-solid fa-images"></i> ${listaFotos.length} fotos</span>` : ''}
                <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold gap-1">
                  <i class="fa-solid fa-magnifying-glass-plus"></i> Clic para ampliar
                </div>
              </div>

              <div class="p-5">
                <h3 class="font-bold text-lg text-white mb-1">${p.nombre}</h3>
                <p class="text-2xl font-black text-purple-400 mb-4">$ ${Number(p.precio || 0).toLocaleString('es-AR')}</p>
                
                <p class="text-xs text-gray-400 mb-2 font-medium">SELECCIONÁ TU TALLE:</p>
                <div class="flex flex-wrap gap-1.5 mb-4">
                  ${listaTalles.map(t => `
                    <button onclick="seleccionarTalle(${p.id}, '${t}')" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition cursor-pointer ${talleElegido === t ? 'bg-purple-600 text-white border-purple-500 shadow-md' : 'bg-gray-800 text-gray-300 border-gray-700 hover:border-gray-500'}">
                      ${t}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="p-5 pt-0 space-y-2">
              <a href="${linkWp}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-sm transition shadow-lg">
                <i class="fa-brands fa-whatsapp text-lg"></i> Pedir por WhatsApp (${talleElegido})
              </a>
              ${esAdmin ? `
                <div class="flex gap-2">
                  <button onclick="cargarDatosEdicion(${p.id})" class="w-1/2 bg-blue-900/40 text-blue-300 hover:bg-blue-900/60 py-2 rounded-xl text-xs font-semibold transition cursor-pointer">✏️ Editar</button>
                  <button onclick="borrarProducto(${p.id})" class="w-1/2 bg-red-900/40 text-red-300 hover:bg-red-900/60 py-2 rounded-xl text-xs font-semibold transition cursor-pointer">🗑️ Borrar</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function abrirModalAdmin() {
      if (esAdmin) {
        document.getElementById('panelAdmin').classList.toggle('hidden');
        return;
      }
      const pass = prompt("Ingrese la Contraseña de Dueño:");
      if (pass === CLAVE_DUENO) {
        esAdmin = true;
        document.getElementById('panelAdmin').classList.remove('hidden');
        renderizar();
      } else if (pass !== null) {
        alert("❌ Contraseña incorrecta.");
      }
    }

    function cerrarSesionAdmin() {
      esAdmin = false;
      document.getElementById('panelAdmin').classList.add('hidden');
      cancelarEdicion();
      renderizar();
    }

    function cambiarTab(tab) {
      if (tab === 'prod') {
        document.getElementById('formProd').classList.remove('hidden');
        document.getElementById('formCloud').classList.add('hidden');
        document.getElementById('tabProd').className = "pb-2 border-b-2 border-purple-500 font-bold text-sm text-purple-300 cursor-pointer";
        document.getElementById('tabCloud').className = "pb-2 border-b-2 border-transparent text-sm text-gray-400 cursor-pointer";
      } else {
        document.getElementById('formProd').classList.add('hidden');
        document.getElementById('formCloud').classList.remove('hidden');
        document.getElementById('tabCloud').className = "pb-2 border-b-2 border-purple-500 font-bold text-sm text-purple-300 cursor-pointer";
        document.getElementById('tabProd').className = "pb-2 border-b-2 border-transparent text-sm text-gray-400 cursor-pointer";
      }
    }

    function cargarDatosEdicion(id) {
      const prod = productos.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('pId').value = prod.id;
      document.getElementById('pNombre').value = prod.nombre;
      document.getElementById('pMarca').value = prod.marca;
      document.getElementById('pPrecio').value = prod.precio;
      document.getElementById('pTalles').value = Array.isArray(prod.talles) ? prod.talles.join(', ') : prod.talles;
      
      // Limpia corchetes y comillas si la base los devuelve formateados
      let fotosLimpias = "";
      if (Array.isArray(prod.foto)) {
        fotosLimpias = prod.foto.join(', ');
      } else if (typeof prod.foto === 'string') {
        fotosLimpias = prod.foto.replace(/[\[\]"]/g, '');
      }
      document.getElementById('pFoto').value = fotosLimpias;

    function cancelarEdicion() {
      document.getElementById('formProd').reset();
      document.getElementById('pId').value = "";
      document.getElementById('tituloFormAdmin').innerHTML = `<i class="fa-solid fa-user-gear"></i> Cargar Nuevo Producto`;
      document.getElementById('btnSubmitProd').innerText = "Guardar Producto en la Nube";
      document.getElementById('btnCancelarEdicion').classList.add('hidden');
    }

    async function guardarProducto(e) {
      e.preventDefault();
      const idEditando = document.getElementById('pId').value;
      const tallesInput = document.getElementById('pTalles').value;
      const arrayTalles = tallesInput.split(',').map(t => t.trim()).filter(t => t !== "");

      const fotosInput = document.getElementById('pFoto').value;
      const arrayFotos = fotosInput.split(',').map(f => f.trim()).filter(f => f !== "");

      const datosProducto = {
        nombre: document.getElementById('pNombre').value.trim(),
        marca: document.getElementById('pMarca').value.trim(),
        precio: Number(document.getElementById('pPrecio').value),
        talles: arrayTalles,
        foto: arrayFotos.length > 1 ? arrayFotos : (arrayFotos[0] || ''),
        disponible: true
      };

      const url = localStorage.getItem('sp_url');
      const key = localStorage.getItem('sp_key');

      if (url && key) {
        try {
          let res;
          if (idEditando) {
            res = await fetch(`${url}/rest/v1/productos?id=eq.${idEditando}`, {
              method: 'PATCH',
              headers: { 
                'apikey': key, 
                'Authorization': `Bearer ${key}`, 
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify(datosProducto)
            });
          } else {
            res = await fetch(`${url}/rest/v1/productos`, {
              method: 'POST',
              headers: { 
                'apikey': key, 
                'Authorization': `Bearer ${key}`, 
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify(datosProducto)
            });
          }

          if (res.ok) {
            alert(idEditando ? "✅ Producto actualizado con éxito en la nube." : "✅ Producto subido a la nube correctamente.");
            cancelarEdicion();
            obtenerProductos();
            return;
          } else {
            const errorText = await res.text();
            alert("❌ Error al guardar en Supabase: " + errorText);
            return;
          }
        } catch (err) { 
          console.error(err); 
          alert("❌ Error de red al conectar con Supabase.");
        }
      } else {
        if (idEditando) {
          productos = productos.map(p => p.id == idEditando ? { ...p, ...datosProducto } : p);
        } else {
          datosProducto.id = Date.now();
          productos.push(datosProducto);
        }
        localStorage.setItem('zapas_local', JSON.stringify(productos));
        cancelarEdicion();
        renderizarFiltrosMarcas();
        renderizar();
        alert("✅ Guardado localmente.");
      }
    }

    async function borrarProducto(id) {
      if (!confirm("¿Estás seguro de que querés borrar este producto?")) return;
      const url = localStorage.getItem('sp_url');
      const key = localStorage.getItem('sp_key');

      if (url && key) {
        try {
          const res = await fetch(`${url}/rest/v1/productos?id=eq.${id}`, {
            method: 'DELETE',
            headers: { 'apikey': key, 'Authorization': `Bearer ${key}` }
          });
          if (res.ok) {
            alert("🗑️ Producto borrado de la nube.");
            obtenerProductos();
            return;
          }
        } catch (err) { console.error(err); }
      }

      productos = productos.filter(p => p.id !== id);
      localStorage.setItem('zapas_local', JSON.stringify(productos));
      renderizarFiltrosMarcas();
      renderizar();
    }

    function filtrarMarca(marca) {
      marcaSeleccionada = marca;
      renderizarFiltrosMarcas();
      renderizar();
    }

    function filtrarProductos() { renderizar(); }
  </script>
</body>
</html>
