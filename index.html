<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapas Chimú | Zapatillas Importadas</title>
  <!-- FAVICON EN LA PESTAÑA DEL NAVEGADOR -->
  <link rel="icon" href="imagenes/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .titulo-urbano {
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.9), 0px 0px 15px rgba(245, 158, 11, 0.3);
    }
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-12 font-sans selection:bg-amber-500 selection:text-black relative">

  <!-- ENCABEZADO -->
  <header class="bg-gray-900/95 backdrop-blur-md border-b border-amber-500/20 sticky top-0 z-40 shadow-xl">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <img src="imagenes/logo.jpeg" alt="Zapas Chimú" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover shadow-xl shadow-amber-500/30 border-2 border-amber-500/60 hover:scale-105 transition duration-300">
        <div>
          <h1 class="text-2xl font-black tracking-wider text-white italic titulo-urbano">ZAPAS CHIMU</h1>
          <p class="text-xs text-amber-400 font-bold tracking-widest uppercase">Catálogo Importado</p>
        </div>
      </div>

      <button id="btnAdminAuth" onclick="abrirModalAdmin()" class="bg-gray-800 hover:bg-gray-700 text-amber-300 border border-amber-500/30 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition cursor-pointer shadow-lg shadow-amber-500/10">
        <i class="fa-solid fa-lock"></i> Modo Administrador
      </button>
    </div>
  </header>

  <!-- BANNER NOTIFICACIÓN -->
  <main class="max-w-6xl mx-auto px-4 mt-6">
    <div class="bg-amber-950/20 border border-amber-500/30 rounded-2xl p-4 mb-6 flex items-center gap-3 shadow-lg">
      <span class="text-2xl">🔥</span>
      <div>
        <p class="text-sm font-black text-amber-300 uppercase tracking-wide">Catálogo Actualizado</p>
        <p class="text-xs text-gray-400">Hacé tu pedido directo a nuestro WhatsApp.</p>
      </div>
    </div>

    <!-- BUSCADOR Y FILTROS -->
    <div class="space-y-4 mb-8">
      <input type="text" id="searchInput" oninput="filtrarProductos()" placeholder="🔍 Buscar por modelo o marca..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white transition shadow-inner">

      <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between bg-gray-900/60 p-4 rounded-2xl border border-gray-800">
        <div class="flex flex-wrap gap-2 items-center" id="contenedorFiltroMarcas">
          <!-- Se generan solas las marcas -->
        </div>
        <div class="flex flex-wrap gap-2 items-center" id="contenedorFiltroTalles">
          <!-- Se generan solos los talles -->
        </div>
      </div>
    </div>

    <!-- MODO DUEÑO / PANEL -->
    <div id="panelAdmin" class="hidden bg-gray-900 border border-amber-500/40 rounded-2xl p-6 mb-8 shadow-2xl">
      <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4 flex-wrap gap-4">
        <h2 id="tituloFormAdmin" class="text-lg font-bold text-amber-300 flex items-center gap-2">
          <i class="fa-solid fa-user-gear"></i> Cargar Nuevo Producto
        </h2>
        <div class="flex gap-3 items-center flex-wrap">
          <button onclick="marcarTodosAgotados()" class="bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-500/40 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer shadow-md">
            <i class="fa-solid fa-triangle-exclamation"></i> Marcar Todo Agotado
          </button>
          <button id="btnCancelarEdicion" onclick="cancelarEdicion()" class="hidden text-xs text-amber-400 hover:underline cursor-pointer">Cancelar Edición</button>
          <button onclick="cerrarSesionAdmin()" class="text-xs text-red-400 hover:underline cursor-pointer">Cerrar Sesión</button>
        </div>
      </div>

      <!-- FORMULARIO PRODUCTO -->
      <form id="formProd" onsubmit="guardarProducto(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="pId">
        
        <div>
          <label class="block text-xs text-gray-400 mb-1">Marca (Elegí o escribí una nueva)</label>
          <input type="text" id="pMarca" list="listaMarcas" required placeholder="Ej: Nike, Adidas..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
          <datalist id="listaMarcas"></datalist>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Nombre del Modelo (Elegí o escribí uno nuevo)</label>
          <input type="text" id="pNombre" list="listaModelos" required placeholder="Ej: Air Force 1" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
          <datalist id="listaModelos"></datalist>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Precio ($ ARS)</label>
          <input type="number" id="pPrecio" required placeholder="Ej: 69800" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
        </div>

        <!-- GENERADOR RÁPIDO DE TALLES -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-gray-400">Talles (Selección rápida o manual)</label>
            <button type="button" onclick="generarRangoTalles()" class="text-[10px] text-amber-400 hover:underline cursor-pointer font-bold">⚡ Generar del 34 al 40</button>
          </div>
          <input type="text" id="pTalles" required placeholder="Ej: 35, 36, 37, 38, 39, 40" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
        </div>

        <!-- CAJITAS DINÁMICAS DE IMÁGENES -->
        <div class="md:col-span-2">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs text-gray-400">URLs de Imágenes (Agregá una cajita por cada foto)</label>
            <button type="button" onclick="agregarCajaUrl()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg text-xs font-bold transition cursor-pointer flex items-center gap-1">
              <i class="fa-solid fa-plus"></i> Agregar otra foto
            </button>
          </div>
          <div id="contenedorCajasUrls" class="space-y-2">
            <!-- Se generan dinámicamente las cajitas -->
          </div>
        </div>

        <div class="md:col-span-2 flex items-center gap-3 bg-gray-800/60 p-3 rounded-lg border border-gray-700">
          <input type="checkbox" id="pDisponible" checked class="w-5 h-5 accent-amber-500 cursor-pointer">
          <label for="pDisponible" class="text-xs text-white font-bold cursor-pointer">Stock Disponible (Desmarcar para mostrar cartel de Agotado)</label>
        </div>

        <button type="submit" id="btnSubmitProd" class="md:col-span-2 bg-amber-500 hover:bg-amber-400 text-black font-black py-3 rounded-xl transition text-sm cursor-pointer shadow-lg shadow-amber-500/20">
          Guardar Producto en la Nube
        </button>
      </form>
    </div>

    <!-- LISTA DE PRODUCTOS -->
    <div id="gridProductos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Se cargan dinámicamente -->
    </div>
  </main>

  <!-- MODAL VISOR DE IMAGEN AMPLIADA -->
  <div id="modalImagen" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="cerrarZoom()">
    <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
      <button onclick="cerrarZoom()" class="absolute -top-12 right-0 text-white text-2xl font-bold bg-gray-800 hover:bg-amber-500 hover:text-black w-10 h-10 rounded-full flex items-center justify-center transition cursor-pointer">&times;</button>
      <img id="imgZoomAmpliada" src="" alt="Zoom Zapatilla" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-2xl border border-gray-800">
      <div id="galeriaMiniaturasZoom" class="flex gap-2 mt-4 overflow-x-auto max-w-full p-2"></div>
    </div>
  </div>

  <!-- BOTÓN VOLVER ARRIBA -->
  <button id="btnVolverArriba" onclick="volverArriba()" class="fixed bottom-6 right-6 z-40 bg-amber-500 hover:bg-amber-400 text-black w-12 h-12 rounded-full flex items-center justify-center shadow-2xl transition duration-300 opacity-0 pointer-events-none cursor-pointer border-2 border-black">
    <i class="fa-solid fa-arrow-up text-lg font-bold"></i>
  </button>

  <!-- SCRIPT LÓGICA -->
  <script>
    const SUPABASE_URL = "https://fvxuonzcwllousjrhjcz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6eZrYUp7h1hraScKsZcPUw_puLaXnBg";

    const CLAVE_DUENO = "chimu2026";
    const NUMERO_WHATSAPP = "5491176165797";
    let productos = [];
    let marcaSeleccionada = "Todas";
    let talleSeleccionado = "Todos";
    let esAdmin = false;
    let tallesSeleccionados = {};
    let varianteSeleccionada = {}; 
    let fotosActualesZoom = [];

    window.onload = () => {
      obtenerProductos();
      window.addEventListener('scroll', evaluarBotonArriba);
      agregarCajaUrl(''); // Inicializar al menos una cajita de imagen al cargar
    };

    function volverArriba() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function evaluarBotonArriba() {
      const btn = document.getElementById('btnVolverArriba');
      if (window.scrollY > 300) {
        btn.classList.remove('opacity-0', 'pointer-events-none');
        btn.classList.add('opacity-100');
      } else {
        btn.classList.add('opacity-0', 'pointer-events-none');
        btn.classList.remove('opacity-100');
      }
    }

    async function obtenerProductos() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?select=*&order=id.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          productos = await res.json();
          actualizarDatalists();
          renderizarFiltros();
          renderizar();
          return;
        } else {
          console.error("Error al conectar con Supabase:", await res.text());
        }
      } catch (err) { 
        console.error("Error de red cargando de Supabase:", err); 
      }
    }

    function actualizarDatalists() {
      const marcas = [...new Set(productos.map(p => p.marca ? p.marca.trim() : '').filter(m => m))];
      const modelos = [...new Set(productos.map(p => p.nombre ? p.nombre.trim() : '').filter(m => m))];

      document.getElementById('listaMarcas').innerHTML = marcas.map(m => `<option value="${m}">`).join('');
      document.getElementById('listaModelos').innerHTML = modelos.map(m => `<option value="${m}">`).join('');
    }

    function renderizarFiltros() {
      // FILTRO DE MARCAS
      const contenedorMarcas = document.getElementById('contenedorFiltroMarcas');
      if (contenedorMarcas) {
        const marcas = productos.map(p => p.marca ? p.marca.trim() : '').filter(m => m !== '');
        const marcasUnicas = ["Todas", ...new Set(marcas)];

        contenedorMarcas.innerHTML = `<span class="text-xs font-bold text-gray-400 mr-2 uppercase">Marca:</span>` +
          marcasUnicas.map(marca => `
            <button onclick="filtrarMarca('${marca}')" class="btn-marca ${marcaSeleccionada.toLowerCase() === marca.toLowerCase() ? 'bg-amber-500 text-black font-black shadow-md shadow-amber-500/20' : 'bg-gray-900 text-gray-400 border border-gray-800 hover:border-amber-500/50'} px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer">
              ${marca}
            </button>
          `).join('');
      }

      // FILTRO DE TALLES
      const contenedorTalles = document.getElementById('contenedorFiltroTalles');
      if (contenedorTalles) {
        let todosTalles = [];
        productos.forEach(p => {
          let t = Array.isArray(p.talles) ? p.talles : String(p.talles || '').split(',').map(x => x.trim());
          todosTalles.push(...t);
        });
        const tallesUnicos = ["Todos", ...new Set(todosTalles.filter(t => t !== ''))].sort((a,b) => a - b);

        contenedorTalles.innerHTML = `<span class="text-xs font-bold text-gray-400 mr-2 uppercase">Talle:</span>` +
          tallesUnicos.map(talle => `
            <button onclick="filtrarTalle('${talle}')" class="btn-talle ${talleSeleccionado.toString().toLowerCase() === talle.toString().toLowerCase() ? 'bg-amber-500 text-black font-black shadow-md shadow-amber-500/20' : 'bg-gray-900 text-gray-400 border border-gray-800 hover:border-amber-500/50'} px-2.5 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer">
              ${talle}
            </button>
          `).join('');
      }
    }

    // GESTIÓN DE CAJITAS DINÁMICAS PARA LAS URLS DE IMÁGENES
    function agregarCajaUrl(valor = '') {
      const contenedor = document.getElementById('contenedorCajasUrls');
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2';
      div.innerHTML = `
        <input type="text" value="${valor}" required placeholder="Ej: https://ejemplo.com/foto.jpg" class="input-url-foto w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
        <button type="button" onclick="this.parentElement.remove()" class="bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-500/40 px-3 py-2.5 rounded-lg text-xs font-semibold transition cursor-pointer">
          <i class="fa-solid fa-trash"></i>
        </button>
      `;
      contenedor.appendChild(div);
    }

    function obtenerArrayFotosInput() {
      const inputs = document.querySelectorAll('.input-url-foto');
      let urls = [];
      inputs.forEach(input => {
        if (input.value.trim() !== '') {
          urls.push(input.value.trim());
        }
      });
      return urls;
    }

    function generarRangoTalles() {
      const desde = prompt("Talle inicial (ej: 34):", "34");
      const hasta = prompt("Talle final (ej: 40):", "40");
      if (!desde || !hasta) return;
      
      let inicio = parseInt(desde);
      let fin = parseInt(hasta);
      let lista = [];
      for (let i = inicio; i <= fin; i++) {
        lista.push(i);
      }
      document.getElementById('pTalles').value = lista.join(', ');
    }

    function seleccionarTalle(idProd, talle) {
      tallesSeleccionados[idProd] = talle;
      renderizar();
    }

    function cambiarVarianteColor(grupoClave, prodId) {
      varianteSeleccionada[grupoClave] = prodId;
      renderizar();
    }

    function obtenerArrayFotos(fotoField) {
      if (!fotoField) return [];
      let str = String(fotoField).replace(/[\[\]"]/g, '');
      return str.split(/[\n,]+/).map(f => f.trim()).filter(f => f !== '');
    }

    function abrirZoom(fotoField, indiceInicial = 0) {
      fotosActualesZoom = obtenerArrayFotos(fotoField);
      if (fotosActualesZoom.length === 0) return;
      mostrarFotoZoom(indiceInicial);
      document.getElementById('modalImagen').classList.remove('hidden');
    }

    function mostrarFotoZoom(indice) {
      const imgElem = document.getElementById('imgZoomAmpliada');
      imgElem.src = fotosActualesZoom[indice];

      const contenedorMini = document.getElementById('galeriaMiniaturasZoom');
      if (fotosActualesZoom.length > 1) {
        contenedorMini.innerHTML = fotosActualesZoom.map((url, idx) => `
          <img src="${url}" onclick="mostrarFotoZoom(${idx})" class="w-16 h-16 object-cover rounded-xl border-2 ${idx === indice ? 'border-amber-500 scale-105' : 'border-gray-800 opacity-60'} cursor-pointer hover:opacity-100 transition">
        `).join('');
      } else {
        contenedorMini.innerHTML = '';
      }
    }

    function cerrarZoom() {
      document.getElementById('modalImagen').classList.add('hidden');
    }

    function renderizar() {
      const grid = document.getElementById('gridProductos');
      if (!grid) return;

      const busquedaInput = document.getElementById('searchInput');
      const busqueda = busquedaInput ? busquedaInput.value.toLowerCase() : '';

      const filtrados = productos.filter(p => {
        const marca = p.marca || '';
        const nombre = p.nombre || '';
        
        let listaTalles = [];
        if (Array.isArray(p.talles)) listaTalles = p.talles;
        else if (typeof p.talles === 'string') listaTalles = p.talles.split(',').map(t => t.trim());

        const coincideMarca = marcaSeleccionada === "Todas" || marca.toLowerCase() === marcaSeleccionada.toLowerCase();
        const coincideTalle = talleSeleccionado === "Todos" || listaTalles.some(t => t.toLowerCase() === talleSeleccionado.toLowerCase());
        const coincideBusqueda = nombre.toLowerCase().includes(busqueda) || marca.toLowerCase().includes(busqueda);
        
        return coincideMarca && coincideTalle && coincideBusqueda;
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 font-medium">No hay productos que coincidan con la búsqueda.</div>`;
        return;
      }

      // AGRUPAR POR MARCA + NOMBRE + PRECIO
      const grupos = {};
      filtrados.forEach(p => {
        const clave = `${(p.marca || '').trim().toLowerCase()}_${(p.nombre || '').trim().toLowerCase()}_${p.precio}`;
        if (!grupos[clave]) {
          grupos[clave] = [];
        }
        grupos[clave].push(p);
      });

      grid.innerHTML = Object.keys(grupos).map(claveGrupo => {
        const variantes = grupos[claveGrupo];
        
        let idActivo = varianteSeleccionada[claveGrupo];
        let p = variantes.find(v => v.id === idActivo) || variantes[0];

        let listaTalles = [];
        if (Array.isArray(p.talles)) {
          listaTalles = p.talles;
        } else if (typeof p.talles === 'string') {
          listaTalles = p.talles.split(',').map(t => t.trim());
        }

        const listaFotos = obtenerArrayFotos(p.foto);
        const fotoPrincipal = listaFotos[0] || 'https://via.placeholder.com/400x400?text=Foto+No+Disponible';
        const fotosEscapadas = JSON.stringify(p.foto || '').replace(/"/g, '&quot;');

        if (!tallesSeleccionados[p.id] && listaTalles.length > 0) {
          tallesSeleccionados[p.id] = listaTalles[0];
        }
        const talleElegido = tallesSeleccionados[p.id] || (listaTalles[0] || 'A consultar');
        const linkWp = `https://wa.me/${NUMERO_WHATSAPP}?text=` + encodeURIComponent(`Hola Zapas Chimú! Me interesa el modelo ${p.marca || ''} ${p.nombre || ''} Talle: ${talleElegido} ($${Number(p.precio || 0).toLocaleString('es-AR')})`);

        const estaDisponible = p.disponible !== false;

        return `
          <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden flex flex-col justify-between hover:border-amber-500/50 hover:shadow-xl hover:shadow-amber-500/5 transition duration-300 group">
            <div>
              <div class="relative h-64 bg-gray-950 overflow-hidden flex items-center justify-center p-2 cursor-pointer" onclick="abrirZoom(${fotosEscapadas}, 0)">
                <img src="${fotoPrincipal}" alt="${p.nombre}" class="w-full h-full object-contain group-hover:scale-105 transition duration-300 ${!estaDisponible ? 'opacity-75' : ''}" onerror="this.src='https://via.placeholder.com/400x400?text=Foto+No+Disponible'">
                
                <!-- MARCA (Esquina superior izquierda) -->
                <span class="absolute top-3 left-3 bg-black/70 backdrop-blur-md border border-amber-500/30 text-xs px-3 py-1 rounded-full text-amber-300 font-black uppercase tracking-wider">${p.marca || 'Zapatillas'}</span>
                
                <!-- CARTEL DE AGOTADO (Esquina superior derecha - Simétrico y limpio) -->
                ${!estaDisponible ? `
                  <span class="absolute top-3 right-3 bg-red-600/90 text-white font-black text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow-lg border border-red-400/50 flex items-center gap-1 z-10">
                    <i class="fa-solid fa-circle-xmark"></i> Agotado
                  </span>
                ` : ''}

                <!-- CONTADOR DE FOTOS (Abajo a la derecha) -->
                ${listaFotos.length > 1 ? `<span class="absolute bottom-3 right-3 bg-black/80 backdrop-blur-md text-[10px] px-2.5 py-1 rounded-lg text-white font-bold flex items-center gap-1.5 border border-gray-700"><i class="fa-solid fa-images text-amber-400"></i> ${listaFotos.length} fotos</span>` : ''}
                
                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-amber-300 text-xs font-bold gap-1 backdrop-blur-[2px]">
                  <i class="fa-solid fa-magnifying-glass-plus"></i> Clic para ampliar
                </div>
              </div>

              <div class="p-5">
                <h3 class="font-black text-lg text-white mb-1 tracking-tight">${p.nombre}</h3>
                <p class="text-2xl font-black text-amber-400 mb-3 tracking-tight">$ ${Number(p.precio || 0).toLocaleString('es-AR')}</p>
                
                <!-- PALETA DE VARIANTES / COLORES -->
                ${variantes.length > 1 ? `
                  <div class="mb-4">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1.5">COLORES / OPCIONES (${variantes.length}):</p>
                    <div class="flex flex-wrap gap-2">
                      ${variantes.map(v => {
                        const fotoVar = obtenerArrayFotos(v.foto)[0] || '';
                        const esActiva = v.id === p.id;
                        return `
                          <button onclick="cambiarVarianteColor('${claveGrupo}', ${v.id})" class="w-9 h-9 rounded-lg border-2 overflow-hidden transition cursor-pointer ${esActiva ? 'border-amber-500 scale-110 shadow-lg shadow-amber-500/20' : 'border-gray-700 opacity-60 hover:opacity-100'}">
                            <img src="${fotoVar}" class="w-full h-full object-cover">
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                ` : ''}

                <p class="text-xs text-gray-400 mb-2 font-bold uppercase tracking-wider">SELECCIONÁ TU TALLE:</p>
                <div class="flex flex-wrap gap-1.5 mb-4">
                  ${listaTalles.map(t => `
                    <button onclick="seleccionarTalle(${p.id}, '${t}')" class="px-3 py-1.5 rounded-xl text-xs font-black border transition cursor-pointer ${talleElegido === t ? 'bg-amber-500 text-black border-amber-400 shadow-md shadow-amber-500/20 scale-105' : 'bg-gray-800 text-gray-300 border-gray-700 hover:border-gray-500'}">
                      ${t}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="p-5 pt-0 space-y-2">
              <a href="${linkWp}" target="_blank" class="w-full ${estaDisponible ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-gray-700 hover:bg-gray-600'} text-white font-black py-3 rounded-xl flex items-center justify-center gap-2 text-sm transition shadow-lg">
                <i class="fa-brands fa-whatsapp text-lg"></i> ${estaDisponible ? `Pedir por WhatsApp (${talleElegido})` : 'Consultar Reposición'}
              </a>
              ${esAdmin ? `
                <div class="flex gap-2">
                  <button onclick="cargarDatosEdicion(${p.id})" class="w-1/2 bg-blue-950/60 text-blue-300 hover:bg-blue-900/80 border border-blue-500/30 py-2 rounded-xl text-xs font-semibold transition cursor-pointer">✏️ Editar</button>
                  <button onclick="borrarProducto(${p.id})" class="w-1/2 bg-red-950/60 text-red-300 hover:bg-red-900/80 border border-red-500/30 py-2 rounded-xl text-xs font-semibold transition cursor-pointer">🗑️ Borrar</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function abrirModalAdmin() {
      if (esAdmin) {
        document.getElementById('panelAdmin').classList.toggle('hidden');
        return;
      }
      const pass = prompt("Ingrese la Contraseña de Dueño:");
      if (pass === CLAVE_DUENO) {
        esAdmin = true;
        document.getElementById('panelAdmin').classList.remove('hidden');
        renderizar();
      } else if (pass !== null) {
        alert("❌ Contraseña incorrecta.");
      }
    }

    function cerrarSesionAdmin() {
      esAdmin = false;
      document.getElementById('panelAdmin').classList.add('hidden');
      cancelarEdicion();
      renderizar();
    }

    function cargarDatosEdicion(id) {
      const prod = productos.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('pId').value = prod.id;
      document.getElementById('pNombre').value = prod.nombre;
      document.getElementById('pMarca').value = prod.marca;
      document.getElementById('pPrecio').value = prod.precio;
      document.getElementById('pTalles').value = Array.isArray(prod.talles) ? prod.talles.join(', ') : prod.talles;
      document.getElementById('pDisponible').checked = prod.disponible !== false;
      
      // Cargar cajitas de fotos
      const contenedor = document.getElementById('contenedorCajasUrls');
      contenedor.innerHTML = '';
      const listaFotos = obtenerArrayFotos(prod.foto);
      if (listaFotos.length > 0) {
        listaFotos.forEach(url => agregarCajaUrl(url));
      } else {
        agregarCajaUrl('');
      }

      document.getElementById('tituloFormAdmin').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Editando Producto #${prod.id}`;
      document.getElementById('btnSubmitProd').innerText = "Actualizar Producto";
      document.getElementById('btnCancelarEdicion').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      document.getElementById('formProd').reset();
      document.getElementById('pId').value = "";
      document.getElementById('pDisponible').checked = true;
      document.getElementById('contenedorCajasUrls').innerHTML = '';
      agregarCajaUrl('');
      document.getElementById('tituloFormAdmin').innerHTML = `<i class="fa-solid fa-user-gear"></i> Cargar Nuevo Producto`;
      document.getElementById('btnSubmitProd').innerText = "Guardar Producto en la Nube";
      document.getElementById('btnCancelarEdicion').classList.add('hidden');
    }

    async function guardarProducto(e) {
      e.preventDefault();
      const idEditando = document.getElementById('pId').value;
      const tallesInput = document.getElementById('pTalles').value;
      const arrayTalles = tallesInput.split(',').map(t => t.trim()).filter(t => t !== "");

      const listaLimpia = obtenerArrayFotosInput();
      if (listaLimpia.length === 0) {
        alert("❌ Debes agregar al menos una URL de imagen.");
        return;
      }
      const fotoTextoPlano = listaLimpia.join(', ');
      const estaDisponible = document.getElementById('pDisponible').checked;

      const datosProducto = {
        nombre: document.getElementById('pNombre').value.trim(),
        marca: document.getElementById('pMarca').value.trim(),
        precio: Number(document.getElementById('pPrecio').value),
        talles: arrayTalles,
        foto: fotoTextoPlano,
        disponible: estaDisponible
      };

      try {
        let res;
        if (idEditando) {
          res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${idEditando}`, {
            method: 'PATCH',
            headers: { 
              'apikey': SUPABASE_KEY, 
              'Authorization': `Bearer ${SUPABASE_KEY}`, 
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify(datosProducto)
          });
        } else {
          res = await fetch(`${SUPABASE_URL}/rest/v1/productos`, {
            method: 'POST',
            headers: { 
              'apikey': SUPABASE_KEY, 
              'Authorization': `Bearer ${SUPABASE_KEY}`, 
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify(datosProducto)
          });
        }

        if (res.ok) {
          alert(idEditando ? "✅ Producto actualizado con éxito en la nube." : "✅ Producto subido a la nube correctamente.");
          cancelarEdicion();
          obtenerProductos();
        } else {
          const errorText = await res.text();
          alert("❌ Error al guardar en Supabase: " + errorText);
        }
      } catch (err) { 
        console.error(err); 
        alert("❌ Error de red al conectar con Supabase.");
      }
    }

    async function borrarProducto(id) {
      if (!confirm("¿Estás seguro de que querés borrar este producto?")) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${id}`, {
          method: 'DELETE',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (res.ok) {
          alert("🗑️ Producto borrado de la nube.");
          obtenerProductos();
        } else {
          alert("❌ No se pudo borrar el producto.");
        }
      } catch (err) { console.error(err); }
    }

    async function marcarTodosAgotados() {
      if (!confirm("⚠️ ¿Estás seguro de marcar TODOS los productos como AGOTADOS? Esto pondrá en false el estado de stock de todo el catálogo.")) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=gt.0`, {
          method: 'PATCH',
          headers: { 
            'apikey': SUPABASE_KEY, 
            'Authorization': `Bearer ${SUPABASE_KEY}`, 
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ disponible: false })
        });

        if (res.ok) {
          alert("✅ Todos los productos fueron marcados como agotados.");
          obtenerProductos();
        } else {
          alert("❌ Hubo un error al actualizar los productos.");
        }
      } catch (err) {
        console.error(err);
        alert("❌ Error de red al intentar actualizar.");
      }
    }

    function filtrarMarca(marca) {
      marcaSeleccionada = marca;
      renderizarFiltros();
      renderizar();
    }

    function filtrarTalle(talle) {
      talleSeleccionado = talle;
      renderizarFiltros();
      renderizar();
    }

    function filtrarProductos() { renderizar(); }
  </script>
</body>
</html>
